name: NixOS Flake Check

on:
  push:
    branches:
      - main
      - testing-younix
    paths-ignore:
      - "README.md"
      - "TASKS.md"
      - "AGENTS.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "TASKS.md"
      - "AGENTS.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check & Build younix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run nix flake check
        run: nix flake check

      - name: Build younix NixOS toplevel
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: nix build .#nixosConfigurations.younix.config.system.build.toplevel --no-link
